name: Build Windows exe

on:
  push:
    tags: ["v*"]          # push a tag like v1.0.0 to publish a release
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
      - name: Test
        shell: bash
        run: |
          # each test file in its own Python: the Windows build machine now and then crashes inside native code
          # (access violation, at a different spot each time) - that can't take the whole run down, and a file
          # that crashes gets one more try. A real failure fails both tries and stops the build.
          fail=0
          for f in tests/test_*.py; do
            python -m pytest -q "$f" || python -m pytest -q "$f" || fail=1
          done
          exit $fail
      - name: Build exe
        run: pyinstaller --noconfirm OrderFormApp.spec
      - name: Make the demo copy
        # same program; a "Demo" file name makes it open its own made-up data (see orderapp/paths.py is_demo)
        run: copy dist\OrderFormApp.exe dist\AIS-Sales-Support-Demo.exe
        shell: cmd
      - uses: actions/upload-artifact@v6
        with:
          name: OrderFormApp
          path: |
            dist/OrderFormApp.exe
            dist/AIS-Sales-Support-Demo.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/OrderFormApp.exe
            dist/AIS-Sales-Support-Demo.exe
