{# usage: {% set picker_id='x' %}{% include '_cust_picker.html' %} ; needs `customers` and optional `pre_customer` #}
<input type="hidden" name="customer_id" id="{{ picker_id }}_id" value="{{ pre_customer or '' }}">
<input id="{{ picker_id }}" list="{{ picker_id }}_list" placeholder="Start typing a property..." autocomplete="off"
  value="{% for c in customers if pre_customer and c.id == pre_customer %}{{ c.name }}{% endfor %}">
<datalist id="{{ picker_id }}_list">{% for c in customers %}<option value="{{ c.name }}" data-id="{{ c.id }}">{% endfor %}</datalist>
<script>
(function(){ const i = document.getElementById('{{ picker_id }}'), h = document.getElementById('{{ picker_id }}_id'),
  l = document.getElementById('{{ picker_id }}_list');
  const map = {}; [...l.options].forEach(o => map[o.value.toLowerCase()] = o.dataset.id);
  const sync = () => { h.value = map[i.value.trim().toLowerCase()] || ''; i.style.borderColor = (i.value && !h.value) ? '#e8a33d' : ''; };
  i.addEventListener('input', sync); i.addEventListener('change', sync);
})();
</script>
