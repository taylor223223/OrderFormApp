{% extends "base.html" %}{% block title %}New order{% endblock %}
{% block body %}
<h1>New order</h1><div class="muted">Pick the customer (optional) and the order form.</div>
<div class="card" style="margin-top:12px;max-width:520px"><label>Customer</label>
<select id="cust"><option value="">(choose later / new customer)</option>{% for c in customers %}<option value="{{ c.id }}" {{ 'selected' if c.id==cid }}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="formcards">{% for k, t in forms %}<a class="formcard" data-form="{{ k }}" href="#"><b>{{ t }}</b><span class="muted small">Open form</span></a>{% endfor %}</div>
{% endblock %}
{% block scripts %}<script>
document.querySelectorAll('.formcard').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); const c = document.getElementById('cust').value;
  location.href = '{{ url_for("orders.editor") }}?form=' + a.dataset.form + (c ? '&customer=' + c : '');
}));
</script>{% endblock %}
