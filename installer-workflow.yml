name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
      - name: Build exe
        run: pyinstaller --noconfirm OrderFormApp.spec
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d') { $v = "0.0.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: OrderFormApp-Setup
          path: dist/OrderFormApp-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/OrderFormApp-Setup.exe
